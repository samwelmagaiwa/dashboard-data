x-backend-service: &backend-service
  build:
    context: ./dashboard-backend
  image: ${BACKEND_IMAGE:-samwelmagaiwa/mlg-dashboard-backend}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - ${BACKEND_ENV_FILE:-./env/backend.production.env}
  volumes:
    - ${BACKEND_STORAGE_PATH:-./dashboard-backend/storage}:/var/www/html/storage
  depends_on:
    - dashboard_redis
  networks:
    - dashboard_network

services:
  dashboard_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - dashboard_network

  dashboard_backend:
    <<: *backend-service
    environment:
      CONTAINER_ROLE: web
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    expose:
      - "80"

  dashboard_worker_1:
    <<: *backend-service
    environment:
      CONTAINER_ROLE: worker
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--queue=high,default", "--sleep=3", "--tries=3", "--timeout=900"]

  dashboard_worker_2:
    <<: *backend-service
    environment:
      CONTAINER_ROLE: worker
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--queue=high,default", "--sleep=3", "--tries=3", "--timeout=900"]

  dashboard_worker_3:
    <<: *backend-service
    environment:
      CONTAINER_ROLE: worker
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--queue=high,default", "--sleep=3", "--tries=3", "--timeout=900"]

  dashboard_scheduler:
    <<: *backend-service
    environment:
      CONTAINER_ROLE: scheduler
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]

  dashboard_watcher:
    <<: *backend-service
    environment:
      CONTAINER_ROLE: watcher
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "sync:watch"]

  dashboard_frontend:
    build:
      context: ./dashboard-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: ${FRONTEND_IMAGE:-samwelmagaiwa/mlg-dashboard-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - dashboard_backend
    environment:
      FRONTEND_SERVER_NAME: ${FRONTEND_SERVER_NAME:-clinicaldashboard.mloganzila.or.tz}
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://dashboard_backend:80}
      NGINX_ENVSUBST_FILTER: 'FRONTEND_SERVER_NAME|BACKEND_UPSTREAM'
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    networks:
      - dashboard_network

networks:
  dashboard_network:
    driver: bridge

volumes:
  redis_data:
